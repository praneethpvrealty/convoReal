name: Release gate E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'e2e/agent-inventory-sharing.mjs'
      - 'src/app/api/agents/inventory-sync/**'
      - 'src/app/api/properties/route.ts'
      - 'src/app/api/properties/**/approve/**'
      - 'src/app/api/properties/**/share-to-agent-account/**'
      - 'src/lib/agents/source-inventory-sync.ts'
      - 'src/lib/inventory/shared-property-copy.ts'
      - 'supabase/migrations/*agent_source_inventory_sync.sql'
      - '.github/workflows/release-gate-e2e.yml'

concurrency:
  group: release-gate-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contact-and-requirements:
    name: Contact, requirements and inventory flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-smoke
    env:
      # These two values are intentionally public client configuration.
      # The privileged key remains masked in the protected environment.
      NEXT_PUBLIC_SUPABASE_URL: https://ucqzafsbckmkeumgpxtb.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_H0SufEzFu7RWQQzKC5nESQ_oQVEtdqi
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx e2e/provision.ts
      - run: npm run dev > /tmp/convoreal-dev.log 2>&1 &
      - run: |
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:3000/login >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/convoreal-dev.log
          exit 1
      - run: npm run test:e2e:contact-followup
      - run: npm run test:e2e:agent-inventory-sharing

  production-ai-billing:
    name: Production AI credits and errors
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-smoke
    env:
      E2E_BASE_URL: https://www.convoreal.com
      NEXT_PUBLIC_SUPABASE_URL: https://ucqzafsbckmkeumgpxtb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:ai-billing
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence-${{ github.run_id }}
          path: test-results/
          retention-days: 14
