name: Daily production AI billing smoke

on:
  schedule:
    # 01:30 IST (20:00 UTC on the preceding day)
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: daily-production-ai-billing-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Production AI billing smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-smoke

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the smoke test
        run: node e2e/daily-ai-billing-smoke.mjs
        env:
          E2E_BASE_URL: https://www.convoreal.com
          NEXT_PUBLIC_SUPABASE_URL: https://ucqzafsbckmkeumgpxtb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-billing-smoke-${{ github.run_id }}
          path: test-results/ai-billing-smoke/
          retention-days: 14
