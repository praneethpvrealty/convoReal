name: CodeQL

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]
  # GitHub runs this repository's schedules hours late; a weekly scan still
  # catches queries CodeQL adds for code nobody has touched.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go-ingress/go.mod
          cache-dependency-path: go-ingress/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Go ingress
        if: matrix.language == 'go'
        working-directory: go-ingress
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
