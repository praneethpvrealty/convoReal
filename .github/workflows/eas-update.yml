name: EAS Update

# Publishes the mobile app's JS bundle over the air when a change to
# mobile/ lands on main. Until this existed, every mobile change waited
# on somebody remembering to run `eas update` by hand — #519 shipped to
# the web the moment it merged and reached phones only because the gap
# was noticed.
#
# An OTA update is not a deploy behind a review. It replaces the running
# bundle on every installed app, so the mobile checks run again here on
# the merged tree rather than being trusted from the PR: two PRs that
# were each green can merge into a main that is not.
#
# The publish is gated on a check that installed apps can actually
# receive it. Both ways that can fail are silent — the CLI reports a
# successful publish either way and the apps stay on their old bundle:
#
#   - Wrong channel. An app only receives updates on the channel baked
#     into its binary: sideloaded team APKs are on `preview`, Google Play
#     installs on `production`. Both are published to, and each is
#     checked for a build at this runtime before anything goes out.
#   - Native change. A new dependency, an app.json plugin or a
#     permission moves the fingerprint runtime version, and no installed
#     build carries the new one. That needs `eas build`, not an update.
#
# The verdict is per channel and platform. At the time of writing iOS
# has only ever had a simulator build, on a runtime the project has
# since moved past, so iOS is skipped with a warning while Android
# publishes normally. When a real iOS build or a new Play build exists
# it starts receiving updates with no change here.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      # Docs do not change the bundle, and every publish costs build
      # minutes and an update group.
      - '!mobile/**.md'
      # Web modules the bundle imports through @shared/; [SHR-003] in
      # src/lib/mobile-parity.test.ts keeps this list whole.
      - 'src/lib/auth/roles.ts'
      - 'src/lib/auth/session-profile.ts'
      - 'src/lib/automations/step-tree.ts'
      - 'src/lib/automations/trigger-meta.ts'
      - 'src/lib/calendar/archive-sort.ts'
      - 'src/lib/calendar/todo-groups.ts'
      - 'src/lib/contacts/list-columns.ts'
      - 'src/lib/contacts/phone-key.ts'
      - 'src/lib/contacts/search-filter.ts'
      - 'src/lib/postgrest-search.ts'
      - 'src/lib/conversations/bot-pause.ts'
      - 'src/lib/conversations/inbox-search.ts'
      - 'src/lib/conversations/text-format.ts'
      - 'src/lib/copilot/nudge-pick.ts'
      - 'src/lib/copilot/tour-copy.ts'
      - 'src/lib/copilot/tours.ts'
      - 'src/lib/dashboard/approval-order.ts'
      - 'src/lib/dashboard/document-approvals.ts'
      - 'src/lib/deals/co-broking.ts'
      - 'src/lib/deals/deadline-rules.ts'
      - 'src/lib/deals/financials.ts'
      - 'src/lib/deals/milestones.ts'
      - 'src/lib/deals/routes.ts'
      - 'src/lib/deals/timeline-attribution.ts'
      - 'src/lib/deals/visibility.ts'
      - 'src/lib/focus/requests.ts'
      - 'src/lib/format/currency.ts'
      - 'src/lib/format/date.ts'
      - 'src/lib/format/days-until.ts'
      - 'src/lib/deals/index-row.ts'
      - 'src/lib/contacts/classifications.ts'
      - 'src/lib/calendar/event-type-defaults.ts'
      - 'src/lib/format/ledger-label.ts'
      - 'src/lib/google-calendar/messages.ts'
      - 'src/lib/journey/lead-interest-labels.ts'
      - 'src/lib/journey/sort.ts'
      - 'src/lib/pipelines/board-layout.ts'
      - 'src/lib/pipelines/brokerage.ts'
      - 'src/lib/pipelines/deal-money.ts'
      - 'src/lib/pulse/internal-view.ts'
      - 'src/lib/pulse/viewed-listings.ts'
      - 'src/lib/radar/alert-defaults.ts'
      - 'src/lib/radar/send-refusal.ts'
      - 'src/lib/inventory/card-badges.ts'
      - 'src/lib/inventory/catalog-product-share.ts'
      - 'src/lib/inventory/listing-availability.ts'
      - 'src/lib/inventory/share-log-request.ts'
      - 'src/lib/inventory/location-privacy.ts'
      - 'src/lib/inventory/property-options.ts'
      - 'src/lib/inventory/listing-core-validation.ts'
      - 'src/lib/inventory/share-recipients.ts'
      - 'src/lib/inventory/showcase-audience.ts'
      - 'src/lib/inventory/showcase-share-scope.ts'
      - 'src/lib/match-feedback.ts'
      - 'src/lib/onboarding/checklist.ts'
      - 'src/lib/showcase/listed-statuses.ts'
      - 'src/lib/showcase/message-preview.ts'
      - 'src/lib/sweep/gap-actions.ts'
      - 'src/lib/today/insights.ts'
      - 'src/lib/broadcasts/recount.ts'
      - 'src/lib/broadcasts/csv-audience.ts'
      - 'src/lib/broadcasts/carrier-template.ts'
      - 'src/lib/format/phone.ts'
      - 'src/lib/voice/campaign-settings.ts'
      - 'src/lib/format/list-time.ts'
      - 'src/lib/inventory/property-sorts.ts'
      - 'src/lib/broadcast-status.ts'
      - 'src/lib/contacts/lead-temp.ts'
      - 'src/lib/conversations/inbox-filters.ts'
      - 'src/lib/conversations/customer-session.ts'
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS channel to publish to, or 'all' for preview and production. A channel with no build at this project's runtime version is skipped."
        required: true
        default: all

concurrency:
  # Serialize, never cancel: a cancelled publish can leave one platform's
  # update group published and the other not.
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Sideloaded team builds are on preview; Google Play builds are on
  # production. Each channel is judged on its own by the gate below, so
  # one with no matching build is skipped rather than published into the
  # void, and the run fails only when no channel can receive anything.
  CHANNELS: ${{ (inputs.channel == '' || inputs.channel == 'all') && 'preview production' || inputs.channel }}
  # Pinned rather than @latest so a CLI release cannot change publishing
  # behaviour without a commit. eas.json requires >= 16.
  EAS_VERSION: 21.8.0

jobs:
  publish:
    name: Publish OTA update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not set. Create a token at https://expo.dev/settings/access-tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Installed once, up front, rather than invoked through `npx` at
      # each call site. The first `npx --yes` of a package installs it,
      # and that install writes to stdout — which silently truncated the
      # fingerprint JSON this workflow redirects to a file. Every CI run
      # starts with a cold npx cache, so that first call is always the
      # affected one.
      - name: Install EAS CLI
        run: npm install --global "eas-cli@${EAS_VERSION}"

      # Same three the PR ran, re-run on the merged tree. A broken bundle
      # published here reaches users directly, with no store review and
      # no preview URL in between.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check installed apps can receive this update
        run: |
          set -uo pipefail

          # `--json` documents that non-JSON goes to stderr, and
          # `fingerprint:generate` breaks that promise: it prefixes
          # stdout with a plain-English line naming the environment
          # variables it loaded, so a straight json.load of its output
          # fails. Parse from the first brace instead.
          #
          # Insisting the result is hash-shaped matters more than it
          # looks: `build:list --runtime-version ""` silently drops the
          # filter and returns builds, so an unreadable fingerprint
          # would wave through the very publish this step exists to
          # block. app.json pins the fingerprint policy, whose runtime
          # version is always 40 hex characters. Retried because a
          # network hiccup here should not fail a merge.
          fingerprint() {
            local platform=$1 channel=$2 out=$3 attempt hash
            for attempt in 1 2 3; do
              if eas fingerprint:generate --platform "$platform" \
                   --environment "$channel" --json --non-interactive > "$out"; then
                hash=$(python3 -c 'import json,sys; t=open(sys.argv[1]).read(); i=t.find("{"); print(json.loads(t[i:]).get("hash","") if i>=0 else "")' "$out" 2>/dev/null || true)
                if printf '%s' "$hash" | grep -qE '^[0-9a-f]{40}$'; then
                  printf '%s' "$hash"
                  return 0
                fi
              fi
              echo "$platform fingerprint attempt $attempt produced no usable hash; retrying" >&2
            done
            return 1
          }

          # Judged per channel and platform, not for the run as a whole.
          # iOS has never had a non-simulator build and production had no
          # current Android build until the Play Store release, so a single
          # verdict would either block every update on that or wave all of
          # them through. A pair nothing can receive is skipped and
          # reported; the job fails only when that is true of every pair.
          : > "$RUNNER_TEMP/publish-targets"
          for channel in $CHANNELS; do
            publishable=()
            for platform in android ios; do
              # --json writes megabytes of fingerprint sources to stdout;
              # a file keeps it out of the log and off a pipe.
              if ! runtime=$(fingerprint "$platform" "$channel" "$RUNNER_TEMP/fingerprint-$channel-$platform.json"); then
                echo "::error::Could not compute a $platform fingerprint for '$channel' after 3 attempts. Publishing without it would risk an update no device can receive, so this is a hard stop rather than a skipped check."
                exit 1
              fi

              builds=$(eas build:list --channel "$channel" \
                --platform "$platform" --runtime-version "$runtime" \
                --status finished --limit 1 --json --non-interactive)
              if [ "$(printf '%s' "$builds" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = "0" ]; then
                echo "::warning::Skipping $platform on '$channel': no finished build on that channel carries runtime $runtime, so an update would reach no device. Either a native change moved the fingerprint, or that platform has no current build — run 'eas build -p $platform --profile $channel'."
                echo "- \`$channel\` \`$platform\` runtime \`$runtime\` — **skipped, no build can receive it**" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              echo "$platform runtime $runtime matches an installed build on '$channel'."
              echo "- \`$channel\` \`$platform\` runtime \`$runtime\` — published" >> "$GITHUB_STEP_SUMMARY"
              publishable+=("$platform")
            done

            if [ ${#publishable[@]} -eq 2 ]; then
              echo "$channel all" >> "$RUNNER_TEMP/publish-targets"
            elif [ ${#publishable[@]} -eq 1 ]; then
              echo "$channel ${publishable[0]}" >> "$RUNNER_TEMP/publish-targets"
            fi
          done

          if [ ! -s "$RUNNER_TEMP/publish-targets" ]; then
            echo "::error::No channel in '$CHANNELS' has a build that could receive this update. Nothing was published."
            exit 1
          fi

      - name: Publish update
        run: |
          subject=$(git log -1 --pretty=%s)
          # --environment decides which EAS variables are baked into the
          # bundle. This project's environments are named after its
          # channels; a mismatch ships the app pointing at another
          # backend, which nothing here would catch.
          mapfile -t targets < "$RUNNER_TEMP/publish-targets"
          for target in "${targets[@]}"; do
            read -r channel platform <<< "$target"
            eas update \
              --channel "$channel" \
              --environment "$channel" \
              --platform "$platform" \
              --message "${subject} (${GITHUB_SHA:0:7})" \
              --non-interactive
          done
