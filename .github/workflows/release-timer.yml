name: Release timer

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what each release branch would do without acting
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: release-timer
  cancel-in-progress: false

jobs:
  release:
    name: Ship release branches past their time limit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: src/scripts/release-timer.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/src/scripts/release-timer.mjs`);
            await run({ github, context, core, dryRun: process.env.DRY_RUN === 'true' });
