name: Inspect Failed EAS Build

# One-shot diagnostic for build 0f14cbe4. Delete after the native
# failure is understood and fixed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-build-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_VERSION: 21.8.0
      BUILD_ID: 0f14cbe4-fcca-40bd-a445-b9a319443e71

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Require Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global "eas-cli@${EAS_VERSION}"

      - name: Show failed build record
        run: eas build:view "$BUILD_ID" --json
