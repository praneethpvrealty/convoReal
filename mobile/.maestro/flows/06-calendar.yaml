appId: com.convoreal.app
name: calendar
---
- launchApp
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "calendar-screen"
    timeout: 20000
# The month header's jump button, matched by its accessibility label:
# iOS folds a Pressable's child text into the parent's label, so the
# word it renders ("Today") is not in the hierarchy at all.
- assertVisible: "Jump to today"
- takeScreenshot: .maestro/shots/06-calendar
