appId: com.convoreal.app
name: inbox-filters
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "inbox-search"
    timeout: 20000
# By id, not label: a waiting thread renders "Needs reply · 2h" in its
# own row, and a text selector matches substrings — so the tap would
# land on a conversation instead of the chip.
- tapOn:
    id: "inbox-filter-needs-reply"
- assertVisible:
    id: "inbox-search"
- tapOn:
    id: "inbox-filter-unanswered"
- assertVisible:
    id: "inbox-search"
- tapOn:
    id: "inbox-filter-unread"
- assertVisible:
    id: "inbox-search"
- takeScreenshot: .maestro/shots/07-inbox-filters
- tapOn:
    id: "inbox-filter-all"
- assertVisible:
    id: "inbox-search"
