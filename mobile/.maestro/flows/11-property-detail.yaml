appId: com.convoreal.app
name: property-detail
---
- launchApp
- tapOn:
    id: "tab-properties"
- extendedWaitUntil:
    visible:
      id: "properties-search"
    timeout: 20000
- tapOn:
    id: "property-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "property-detail-screen"
    timeout: 20000
- takeScreenshot: .maestro/shots/11-property-detail
- back
- assertVisible:
    id: "properties-search"
