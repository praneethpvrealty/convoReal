appId: com.convoreal.app
name: login
---
- launchApp:
    clearState: true
- assertVisible: "ConvoReal"
- tapOn:
    id: "login-mode-email"
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "inbox-search"
    timeout: 30000
- takeScreenshot: .maestro/shots/01-login
