appId: com.convoreal.app
name: more-navigation
---
- launchApp
- tapOn:
    id: "tab-more"
# Each menu row is a route that has to mount without throwing. Waiting
# for the row itself to disappear is what proves the push happened: a
# text selector matches substrings, so asserting a screen title like
# "Overview" would already be satisfied by the "Overview & stats" row
# that opened it, and the flow would pass without navigating anywhere.
- scrollUntilVisible:
    element:
      id: "menu-focus"
- tapOn:
    id: "menu-focus"
- extendedWaitUntil:
    notVisible:
      id: "menu-focus"
    timeout: 20000
- back

- scrollUntilVisible:
    element:
      id: "menu-deals"
- tapOn:
    id: "menu-deals"
- extendedWaitUntil:
    notVisible:
      id: "menu-deals"
    timeout: 20000
- back

- scrollUntilVisible:
    element:
      id: "menu-dashboard"
- tapOn:
    id: "menu-dashboard"
- extendedWaitUntil:
    notVisible:
      id: "menu-dashboard"
    timeout: 20000
- takeScreenshot: .maestro/shots/12-dashboard
- back

- scrollUntilVisible:
    element:
      id: "menu-notifications"
- tapOn:
    id: "menu-notifications"
- extendedWaitUntil:
    notVisible:
      id: "menu-notifications"
    timeout: 20000
- back
- assertVisible:
    id: "menu-notifications"
